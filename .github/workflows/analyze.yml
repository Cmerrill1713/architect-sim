name: Architecture Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git temporal analysis

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install architect-sim
        run: |
          pip install pyyaml
          pip install -e .

      - name: Run analysis
        id: analysis
        run: |
          # Run in analyze-only mode, output JSON
          architect-sim --root . --analyze-only --format json > analysis.json 2>analysis.log

          # Extract grade for summary
          GRADE=$(python3 -c "import json; d=json.load(open('analysis.json')); print(d['grade']['letter'])")
          SCORE=$(python3 -c "import json; d=json.load(open('analysis.json')); print(d['grade']['overall'])")
          CRITICAL=$(python3 -c "import json; d=json.load(open('analysis.json')); print(d['summary']['findings_critical'])")

          echo "grade=$GRADE" >> $GITHUB_OUTPUT
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Generate markdown report
        run: |
          architect-sim --root . --analyze-only --format markdown > report.md 2>/dev/null || true

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-analysis
          path: |
            analysis.json
            analysis.log
            report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const grade = '${{ steps.analysis.outputs.grade }}';
            const score = '${{ steps.analysis.outputs.score }}';
            const critical = '${{ steps.analysis.outputs.critical }}';

            const body = `## Architecture Analysis

            **Grade: ${grade} (${score}/100)** | Critical issues: ${critical}

            <details>
            <summary>View full report</summary>

            See the uploaded artifact for the complete analysis.
            </details>

            *Generated by [architect-sim](https://github.com/Cmerrill1713/architect-sim)*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on critical threshold
        if: steps.analysis.outputs.critical > 50
        run: |
          echo "::error::Architecture analysis found ${{ steps.analysis.outputs.critical }} critical issues (threshold: 50)"
          exit 1
