[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "architect-sim"
version = "0.1.0"
description = "Static analysis simulator for microservice architectures"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyyaml>=5.0"]

[project.scripts]
architect-sim = "architect_sim.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
